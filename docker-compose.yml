services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["python", "-m", "pytest"]
    volumes:
      - .:/workspace
    profiles: ["dev"]

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./results:/workspace/results
    profiles: ["agent"]

  benchmark:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["benchmark", "run", "--config", "configs/benchmark.yaml"]
    volumes:
      - ./results:/workspace/results
    profiles: ["benchmark"]

  mock-inference:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["python", "-m", "contextlab.inference.mock_server", "--host", "0.0.0.0", "--port", "8010"]
    ports: ["8010:8010"]
    profiles: ["dev", "mock"]

  vllm:
    build:
      context: .
      dockerfile: docker/Dockerfile.vllm
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-Coder-7B-Instruct}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    ports: ["8000:8000"]
    volumes:
      - model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["gpu"]

volumes:
  model-cache:
